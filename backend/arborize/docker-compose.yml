version: '3.8'

services:
  # Banco de Dados PostgreSQL
  postgres:
    image: postgres:15
    container_name: arborize-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arborize_db
    ports:
      - "5432:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data

  # Servidor de Arquivos MinIO
  minio:
    image: minio/minio
    container_name: arborize-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # Porta da API
      - "9001:9001" # Porta do Painel Visual
    command: server /data --console-address ":9001"
    volumes:
      - ./docker-data/minio:/data

volumes:
  postgres_data:
  minio_data: