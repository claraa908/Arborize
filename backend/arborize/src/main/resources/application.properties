spring.application.name=arborize
spring.web.base.path=/arborize
spring.profiles.active=${APP_PROFILE:local}
spring.jpa.open-in-view=false
server.port=8080

# Preserva o teto de transporte já utilizado no perfil local. O inventário valida 2 MiB por imagem.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Permite devolver 413 para requisições imediatamente acima do teto, sem descarte ilimitado.
server.tomcat.max-swallow-size=11MB

cors.origins=${CORS_ORIGINS:http://locahost:5173,http://localhost:3000,http://127.0.0.1:3000,http://127.0.0.1:5173}
