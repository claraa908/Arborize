spring.application.name=arborize
spring.web.base.path=/arborize
spring.profiles.active=${APP_PROFILE:local}
spring.jpa.open-in-view=false
server.port=8080
arborize.solicitacao.max-mudas=${ARBORIZA_SOLICITACAO_MAX_MUDAS:3}
