spring.application.name=arborize
spring.web.base.path=/arborize
spring.profiles.active=${APP_PROFILE:local}
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.port=8080

cors.origins=${CORS_ORIGINS:http://locahost:5173,http://localhost:3000,http://127.0.0.1:3000,http://127.0.0.1:5173}
app.jwt.secret=${JWT_SECRET:}
