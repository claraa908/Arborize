spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.datasource.url=${ARBORIZA_DB_URL:jdbc:postgresql://localhost:${ARBORIZA_DB_PORT:5433}/${ARBORIZA_DB_NAME:arborize_db}}
spring.datasource.username=${ARBORIZA_DB_USER:postgres}
spring.datasource.password=${ARBORIZA_DB_PASSWORD:postgres}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/manual/bairros-referencia-quixada.sql

minio.url=${ARBORIZA_MINIO_URL:http://localhost:${ARBORIZA_MINIO_API_PORT:9000}}
minio.access.key=${ARBORIZA_MINIO_ACCESS_KEY:minioadmin}
minio.secret.key=${ARBORIZA_MINIO_SECRET_KEY:minioadmin}
minio.bucket.name=${ARBORIZA_MINIO_BUCKET:arborize-materials}

cors.origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

arborize.dev.admin-bootstrap.enabled=${ARBORIZA_DEV_ADMIN_BOOTSTRAP_ENABLED:false}
arborize.dev.admin-bootstrap.email=${ARBORIZA_DEV_ADMIN_EMAIL:}
arborize.dev.admin-bootstrap.password=${ARBORIZA_DEV_ADMIN_PASSWORD:}
